<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Product image placeholder</title>
  <desc id="desc">Neutral placeholder shown when a product image is unavailable.</desc>
  <rect width="800" height="800" fill="#f3f4f6"/>
  <rect x="180" y="180" width="440" height="440" rx="24" fill="#e5e7eb" stroke="#cbd5e1" stroke-width="8"/>
  <path d="M260 500l90-120 70 90 60-70 60 100" fill="none" stroke="#94a3b8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="325" cy="300" r="34" fill="#94a3b8"/>
  <text x="400" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#64748b">Image unavailable</text>
</svg>
